name: Build BGMI Spoofer
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Compile Native C++ (Zygisk)
      run: |
        mkdir -p module/zygisk/arm64-v8a
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ \
          -shared -fPIC -std=c++17 -O2 -s -o module/zygisk/arm64-v8a/zygisk.so main.cpp \
          -llog -landroid -I.

    - name: Package Magisk Module
      run: |
        cd module
        zip -r ../BGMI_Spoofer.zip .
        cd ..
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BGMI_Spoofer_Module
        path: BGMI_Spoofer.zip
